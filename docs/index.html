<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Game Ranking</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050505;
      color: #111;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 12px;
      box-sizing: border-box;
      background: #050505;
    }

    main {
      width: 100%;
      min-height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      background: #f7f7f2;
      border: 4px solid #fff;
      border-radius: 18px;
      padding: 18px 14px 16px;
      box-sizing: border-box;
    }

    header {
      display: grid;
      gap: 8px;
      border-bottom: 4px solid #111;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 14vw, 72px);
      line-height: 1;
      letter-spacing: 0;
    }

    .updated {
      font-size: 15px;
      font-weight: 700;
      color: #444;
    }

    .ranking {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
      flex: 1;
    }

    .entry {
      display: grid;
      grid-template-columns: 54px 1fr;
      align-items: center;
      gap: 10px 14px;
      background: #111;
      color: #fff;
      border-radius: 12px;
      padding: 16px 14px;
      min-height: 86px;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.24);
    }

    .rank {
      font-size: 22px;
      font-weight: 900;
      line-height: 1;
    }

    .time {
      font-size: clamp(34px, 13vw, 64px);
      font-weight: 900;
      line-height: 1;
      text-align: right;
    }

    .cleared {
      grid-column: 2;
      font-size: 15px;
      font-weight: 700;
      opacity: 0.8;
      white-space: nowrap;
      text-align: right;
    }

    .empty,
    .error {
      background: #fff;
      border: 2px solid #111;
      border-radius: 12px;
      padding: 24px;
      font-size: 18px;
      min-height: 120px;
      display: grid;
      place-items: center;
    }

    @media (min-width: 720px) {
      body {
        display: grid;
        place-items: center;
        padding: 28px;
      }

      main {
        width: min(680px, 100%);
        min-height: auto;
      }

      header {
        grid-template-columns: 1fr auto;
        align-items: end;
      }

      .updated {
        text-align: right;
      }

      .entry {
        grid-template-columns: 70px 1fr auto;
      }

      .cleared {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>ランキング</h1>
      <div class="updated" id="updated">読み込み中</div>
    </header>
    <ol class="ranking" id="ranking"></ol>
  </main>

  <script>
    const rankingElement = document.getElementById("ranking");
    const updatedElement = document.getElementById("updated");

    function formatTime(seconds) {
      const safeSeconds = Math.max(0, Number(seconds) || 0);
      const minutes = Math.floor(safeSeconds / 60);
      const wholeSeconds = Math.floor(safeSeconds % 60);
      return `${minutes}分${wholeSeconds}秒`;
    }

    function formatClearedAt(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("ja-JP", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderEntries(entries) {
      rankingElement.innerHTML = "";
      const sortedEntries = [...entries]
        .filter(entry => entry && Number.isFinite(Number(entry.clearTimeSeconds)))
        .sort((a, b) => Number(a.clearTimeSeconds) - Number(b.clearTimeSeconds))
        .slice(0, 5);

      if (sortedEntries.length === 0) {
        rankingElement.innerHTML = `<li class="empty">まだ記録がありません</li>`;
        return;
      }

      sortedEntries.forEach((entry, index) => {
        const item = document.createElement("li");
        item.className = "entry";
        item.innerHTML = `
          <span class="rank">${index + 1}位</span>
          <span class="time">${formatTime(entry.clearTimeSeconds)}</span>
          <span class="cleared">${formatClearedAt(entry.clearedAt)}</span>
        `;
        rankingElement.appendChild(item);
      });
    }

    async function loadRanking() {
      try {
        const response = await fetch(`ranking-data.json?ts=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        renderEntries(Array.isArray(data.entries) ? data.entries : []);
        updatedElement.textContent = `更新 ${new Date().toLocaleTimeString("ja-JP", { hour: "2-digit", minute: "2-digit" })}`;
      } catch (error) {
        rankingElement.innerHTML = `<li class="error">ランキングを読み込めませんでした</li>`;
        updatedElement.textContent = "読み込み失敗";
      }
    }

    loadRanking();
    setInterval(loadRanking, 15000);
  </script>
</body>
</html>
